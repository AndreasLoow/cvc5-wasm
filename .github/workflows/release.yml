name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag name to use for a dry run (no release is published)"
        required: false
        default: "v0.0.0-dev"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # -eo pipefail, so a failing test cannot be masked by a pipe into tee
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pick the tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (emsdk + cvc5 + wrapper)
        run: ./build.sh

      - name: npm test (node)
        run: npm test | tee node-test.log

      - name: Browser test (Chromium and Firefox, no COOP/COEP)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox
          npm run test:browser | tee browser-test.log

      - name: Package
        id: package
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          tar -czf "cvc5-wasm-$TAG.tar.gz" -C dist .
          (cd dist && zip -qr "../cvc5-wasm-$TAG.zip" .)
          raw=$(wc -c < dist/cvc5.wasm)
          gz=$(gzip -9 -c dist/cvc5.wasm | wc -c)
          {
            echo "## cvc5-wasm $TAG"
            echo
            echo "cvc5 as a WebAssembly library: one persistent module, one synchronous"
            echo '`solve(script)` call.  See the README inside the archives for the API.'
            echo
            sed -n '1,200p' dist/VERSION.json | sed 's/^/    /'
            echo
            echo "### Sizes"
            echo
            printf '| file | bytes | gzipped |\n|---|---|---|\n'
            printf '| cvc5.wasm | %s | %s |\n' "$raw" "$gz"
            printf '| cvc5.js | %s | %s |\n' "$(wc -c < dist/cvc5.js)" "$(gzip -9 -c dist/cvc5.js | wc -c)"
            echo
            echo "### node ($(node --version))"
            echo
            echo '```'
            grep -E "trivial query:|swap corpus:|heap |tests passed|check\(s\) failed" node-test.log || true
            echo '```'
            echo
            echo "### Browsers"
            echo
            echo '```'
            grep -E "^==|crossOriginIsolated|trivial query:|swap corpus:|checks passed|check\(s\) failed" browser-test.log || true
            echo '```'
            echo
            echo "The numbers above are this CI runner's.  Measured on the"
            echo "development machine (4-core x86-64, node 22, headless Chromium 151),"
            echo "with native cvc5 1.3.4 and cvc5's own cvc5-Wasm.zip for reference:"
            echo
            printf '| where | trivial query | swap corpus (87 queries) |\n|---|---|---|\n'
            printf '| native cvc5 1.3.4, one process per query | 5 ms | 0.74 s |\n'
            printf '| this build, node 22 | 1.36 ms | 0.38 s |\n'
            printf '| this build, Chromium 151 | 1.52 ms | 0.50 s |\n'
            printf '| this build, Firefox 153 | 5.72 ms | 2.04 s |\n'
            printf '| cvc5-Wasm.zip 1.3.4 via callMain, Chromium 151 | 45.96 ms | 4.58 s |\n'
            echo
            echo "Targets were a trivial query under 3 ms in node and under 10 ms in"
            echo "Chromium, and the corpus under 2 s in Chromium.  The README has the"
            echo "full story, including the one patch applied to cvc5, the choice of"
            echo "-fwasm-exceptions, and why the wasm is larger than cvc5's CLI build."
          } > notes.md
          cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: cvc5-wasm-${{ steps.tag.outputs.name }}
          path: |
            cvc5-wasm-*.tar.gz
            cvc5-wasm-*.zip
            notes.md

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh release create "$TAG" \
            --title "cvc5-wasm $TAG" \
            --notes-file notes.md \
            "cvc5-wasm-$TAG.tar.gz" "cvc5-wasm-$TAG.zip"
